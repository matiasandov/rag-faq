<svg viewBox="0 0 1200 1600" xmlns="http://www.w3.org/2000/svg">
  <!-- Title -->
  <text x="600" y="40" font-size="32" font-weight="bold" text-anchor="middle" fill="#1e293b">
    Car RAG Pipeline - Document Processing Flow
  </text>
  
  <!-- ========== STAGE 1: scraper.py ========== -->
  <g id="scraper-stage">
    <!-- Box -->
    <rect x="50" y="80" width="1100" height="280" rx="15" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
    
    <!-- Header -->
    <rect x="50" y="80" width="1100" height="50" rx="15" fill="#3b82f6"/>
    <text x="600" y="112" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      1. scraper.py - PDF Processing &amp; Extraction
    </text>
    
    <!-- Input -->
    <g transform="translate(80, 150)">
      <rect width="200" height="80" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
      <text x="100" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#1e40af">INPUT</text>
      <text x="100" y="50" font-size="14" text-anchor="middle" fill="#1e40af">📄 accesorios.pdf</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 290 190 L 340 190" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Processing -->
    <g transform="translate(350, 150)">
      <rect width="420" height="180" rx="8" fill="white" stroke="#3b82f6" stroke-width="2"/>
      <text x="210" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">PROCESSING STEPS</text>
      <text x="20" y="50" font-size="12" fill="#334155">1. Extract text from PDF (PyPDF2)</text>
      <text x="20" y="70" font-size="12" fill="#334155">2. Identify sections and headers</text>
      <text x="20" y="90" font-size="12" fill="#334155">3. Extract acronym definitions</text>
      <text x="20" y="110" font-size="12" fill="#334155">4. Parse process information</text>
      <text x="20" y="130" font-size="12" fill="#334155">5. Create chunks (500 chars, 50 overlap)</text>
      <text x="20" y="150" font-size="12" fill="#334155">6. Add metadata to each chunk</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 780 240 L 830 240" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Output -->
    <g transform="translate(840, 150)">
      <rect width="280" height="180" rx="8" fill="#bfdbfe" stroke="#3b82f6" stroke-width="2"/>
      <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#1e40af">OUTPUT (Chunk Example)</text>
      <text x="10" y="45" font-size="9" font-family="monospace" fill="#475569">{</text>
      <text x="15" y="57" font-size="9" font-family="monospace" fill="#475569">id: "accesorios_chunk_0",</text>
      <text x="15" y="69" font-size="9" font-family="monospace" fill="#475569">text: "Process Name: AOC...",</text>
      <text x="15" y="81" font-size="9" font-family="monospace" fill="#475569">metadata: {</text>
      <text x="25" y="93" font-size="9" font-family="monospace" fill="#0369a1">source: "accesorios.pdf",</text>
      <text x="25" y="105" font-size="9" font-family="monospace" fill="#0369a1">section: "AOC Process",</text>
      <text x="25" y="117" font-size="9" font-family="monospace" fill="#0369a1">section_level: 1,</text>
      <text x="25" y="129" font-size="9" font-family="monospace" fill="#0369a1">chunk_index: 0,</text>
      <text x="25" y="141" font-size="9" font-family="monospace" fill="#7c3aed">title: "Car Manual",</text>
      <text x="25" y="153" font-size="9" font-family="monospace" fill="#7c3aed">author: "Ford",</text>
      <text x="25" y="165" font-size="9" font-family="monospace" fill="#7c3aed">pages: 42</text>
      <text x="15" y="177" font-size="9" font-family="monospace" fill="#475569">}</text>
      <text x="10" y="189" font-size="9" font-family="monospace" fill="#475569">}</text>
    </g>
  </g>
  
  <!-- Connecting Arrow -->
  <path d="M 600 360 L 600 400" stroke="#1e293b" stroke-width="4" fill="none" marker-end="url(#arrowhead-large)"/>
  <text x="650" y="385" font-size="14" fill="#64748b">Chunks + Metadata</text>
  
  <!-- ========== STAGE 2: embedder.py ========== -->
  <g id="embedder-stage">
    <!-- Box -->
    <rect x="50" y="410" width="1100" height="280" rx="15" fill="#d1fae5" stroke="#10b981" stroke-width="3"/>
    
    <!-- Header -->
    <rect x="50" y="410" width="1100" height="50" rx="15" fill="#10b981"/>
    <text x="600" y="442" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      2. embedder.py - Vector Embedding &amp; Storage
    </text>
    
    <!-- Input -->
    <g transform="translate(80, 480)">
      <rect width="200" height="80" rx="8" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
      <text x="100" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#065f46">INPUT</text>
      <text x="100" y="50" font-size="14" text-anchor="middle" fill="#065f46">Text Chunks</text>
      <text x="100" y="68" font-size="14" text-anchor="middle" fill="#065f46">+ Metadata</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 290 520 L 340 520" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Processing -->
    <g transform="translate(350, 480)">
      <rect width="420" height="180" rx="8" fill="white" stroke="#10b981" stroke-width="2"/>
      <text x="210" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">PROCESSING STEPS</text>
      <text x="20" y="50" font-size="12" fill="#334155">1. Load SentenceTransformer model</text>
      <text x="20" y="70" font-size="12" fill="#334155">   (all-MiniLM-L6-v2)</text>
      <text x="20" y="95" font-size="12" fill="#334155">2. Convert text → vectors (384 dimensions)</text>
      <text x="20" y="115" font-size="12" fill="#334155">3. Flatten metadata for ChromaDB</text>
      <text x="20" y="135" font-size="12" fill="#334155">4. Store in persistent ChromaDB collection</text>
      <text x="20" y="155" font-size="12" fill="#334155">5. Enable similarity search (cosine)</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 780 570 L 830 570" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Output -->
    <g transform="translate(840, 480)">
      <rect width="280" height="180" rx="8" fill="#a7f3d0" stroke="#10b981" stroke-width="2"/>
      <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#065f46">OUTPUT</text>
      <text x="20" y="50" font-size="12" fill="#065f46">• ChromaDB collection</text>
      <text x="20" y="70" font-size="12" fill="#065f46">• 145 vector embeddings</text>
      <text x="20" y="90" font-size="12" fill="#065f46">• Indexed for search</text>
      <text x="20" y="115" font-size="11" font-family="monospace" fill="#475569">vector = [</text>
      <text x="30" y="130" font-size="11" font-family="monospace" fill="#475569">  0.12, -0.45,</text>
      <text x="30" y="145" font-size="11" font-family="monospace" fill="#475569">  0.78, ..., 0.34</text>
      <text x="20" y="160" font-size="11" font-family="monospace" fill="#475569">] (384 dims)</text>
    </g>
  </g>
  
  <!-- Connecting Arrow -->
  <path d="M 600 690 L 600 730" stroke="#1e293b" stroke-width="4" fill="none" marker-end="url(#arrowhead-large)"/>
  <text x="650" y="715" font-size="14" fill="#64748b">Vector Database Ready</text>
  
  <!-- ========== STAGE 3: query_interface.py ========== -->
  <g id="query-stage">
    <!-- Box -->
    <rect x="50" y="740" width="1100" height="320" rx="15" fill="#e9d5ff" stroke="#a855f7" stroke-width="3"/>
    
    <!-- Header -->
    <rect x="50" y="740" width="1100" height="50" rx="15" fill="#a855f7"/>
    <text x="600" y="772" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      3. query_interface.py - Query Processing &amp; LLM Generation
    </text>
    
    <!-- Input -->
    <g transform="translate(80, 810)">
      <rect width="200" height="100" rx="8" fill="#ddd6fe" stroke="#a855f7" stroke-width="2"/>
      <text x="100" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#6b21a8">INPUT</text>
      <text x="100" y="50" font-size="13" text-anchor="middle" fill="#6b21a8">💬 User Question:</text>
      <text x="100" y="70" font-size="11" text-anchor="middle" fill="#6b21a8">"¿Cuántos puntos</text>
      <text x="100" y="85" font-size="11" text-anchor="middle" fill="#6b21a8">AOC DELL?"</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 290 860 L 340 860" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Processing -->
    <g transform="translate(350, 810)">
      <rect width="420" height="220" rx="8" fill="white" stroke="#a855f7" stroke-width="2"/>
      <text x="210" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b21a8">PROCESSING STEPS</text>
      <text x="20" y="50" font-size="12" fill="#334155">1. Embed question (same model as docs)</text>
      <text x="20" y="70" font-size="12" fill="#334155">2. Similarity search in ChromaDB</text>
      <text x="20" y="90" font-size="12" fill="#334155">3. Retrieve top K chunks (K=3-5)</text>
      <text x="20" y="110" font-size="12" fill="#334155">4. Format context with metadata</text>
      <text x="20" y="130" font-size="12" fill="#334155">5. Build prompt: System + Context + Q</text>
      <text x="20" y="150" font-size="12" fill="#334155">6. Send to Ollama (llama3.2)</text>
      <text x="20" y="170" font-size="12" fill="#334155">7. Generate answer based on context</text>
      <text x="20" y="190" font-size="12" fill="#334155">8. Return answer + source citations</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 780 920 L 830 920" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Output -->
    <g transform="translate(840, 810)">
      <rect width="280" height="220" rx="8" fill="#ddd6fe" stroke="#a855f7" stroke-width="2"/>
      <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b21a8">OUTPUT</text>
      <text x="20" y="50" font-size="12" fill="#6b21a8">💡 AI Answer:</text>
      <text x="20" y="68" font-size="10" fill="#334155">"Se otorgan 10 puntos</text>
      <text x="20" y="82" font-size="10" fill="#334155">por cada accesorio..."</text>
      <text x="20" y="105" font-size="12" fill="#6b21a8">📚 Sources (3):</text>
      <text x="20" y="125" font-size="10" fill="#334155">1. AOC Process (92%)</text>
      <text x="20" y="140" font-size="10" fill="#334155">2. Puntos (87%)</text>
      <text x="20" y="155" font-size="10" fill="#334155">3. Criterios (81%)</text>
      <text x="20" y="180" font-size="11" font-family="monospace" fill="#475569">result = {</text>
      <text x="30" y="195" font-size="11" font-family="monospace" fill="#475569">  answer: "...",</text>
      <text x="30" y="210" font-size="11" font-family="monospace" fill="#475569">  sources: [...]</text>
    </g>
  </g>
  
  <!-- Connecting Arrow -->
  <path d="M 600 1060 L 600 1100" stroke="#1e293b" stroke-width="4" fill="none" marker-end="url(#arrowhead-large)"/>
  <text x="650" y="1085" font-size="14" fill="#64748b">Answer + Citations</text>
  
  <!-- ========== STAGE 4: app.py ========== -->
  <g id="app-stage">
    <!-- Box -->
    <rect x="50" y="1110" width="1100" height="280" rx="15" fill="#fed7aa" stroke="#f97316" stroke-width="3"/>
    
    <!-- Header -->
    <rect x="50" y="1110" width="1100" height="50" rx="15" fill="#f97316"/>
    <text x="600" y="1142" font-size="24" font-weight="bold" text-anchor="middle" fill="white">
      4. app.py - User Interface &amp; Orchestration (Streamlit)
    </text>
    
    <!-- Input -->
    <g transform="translate(80, 1180)">
      <rect width="200" height="80" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
      <text x="100" y="25" font-size="16" font-weight="bold" text-anchor="middle" fill="#9a3412">INPUT</text>
      <text x="100" y="50" font-size="14" text-anchor="middle" fill="#9a3412">User interactions</text>
      <text x="100" y="68" font-size="14" text-anchor="middle" fill="#9a3412">PDF uploads</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 290 1220 L 340 1220" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Processing -->
    <g transform="translate(350, 1180)">
      <rect width="420" height="180" rx="8" fill="white" stroke="#f97316" stroke-width="2"/>
      <text x="210" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#9a3412">ORCHESTRATION</text>
      <text x="20" y="50" font-size="12" fill="#334155">1. Manage Streamlit interface</text>
      <text x="20" y="70" font-size="12" fill="#334155">2. Handle user queries</text>
      <text x="20" y="90" font-size="12" fill="#334155">3. Coordinate PDF processing</text>
      <text x="20" y="110" font-size="12" fill="#334155">4. Display answers with sources</text>
      <text x="20" y="130" font-size="12" fill="#334155">5. Maintain chat history</text>
      <text x="20" y="150" font-size="12" fill="#334155">6. Show collection statistics</text>
    </g>
    
    <!-- Arrow -->
    <path d="M 780 1270 L 830 1270" stroke="#1e293b" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
    
    <!-- Output -->
    <g transform="translate(840, 1180)">
      <rect width="280" height="180" rx="8" fill="#fed7aa" stroke="#f97316" stroke-width="2"/>
      <text x="140" y="25" font-size="14" font-weight="bold" text-anchor="middle" fill="#9a3412">OUTPUT</text>
      <text x="20" y="50" font-size="12" fill="#9a3412">🖥️ Web Interface:</text>
      <text x="20" y="70" font-size="11" fill="#334155">• Chat interface</text>
      <text x="20" y="88" font-size="11" fill="#334155">• PDF upload page</text>
      <text x="20" y="106" font-size="11" fill="#334155">• Statistics dashboard</text>
      <text x="20" y="124" font-size="11" fill="#334155">• Chat history</text>
      <text x="20" y="142" font-size="11" fill="#334155">• Real-time responses</text>
      <text x="20" y="160" font-size="11" fill="#334155">• Source citations</text>
    </g>
  </g>
  
  <!-- Feedback Arrow -->
  <path d="M 1130 1250 Q 1180 900 1130 550" stroke="#64748b" stroke-width="3" fill="none" marker-end="url(#arrowhead)" stroke-dasharray="8,4"/>
  <text x="1155" y="900" font-size="12" fill="#64748b" transform="rotate(90 1155 900)">New PDF Upload</text>
  
  <!-- ========== EXAMPLE DATA FLOW ========== -->
  <g id="example-flow">
    <rect x="50" y="1420" width="1100" height="150" rx="15" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
    <text x="600" y="1450" font-size="20" font-weight="bold" text-anchor="middle" fill="#1e293b">
      Complete Example: Query Lifecycle
    </text>
    
    <g transform="translate(80, 1470)">
      <!-- Step 1 -->
      <circle cx="30" cy="15" r="15" fill="#3b82f6"/>
      <text x="30" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">1</text>
      <text x="55" y="20" font-size="11" fill="#334155">Question asked</text>
      
      <!-- Step 2 -->
      <circle cx="200" cy="15" r="15" fill="#10b981"/>
      <text x="200" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">2</text>
      <text x="225" y="20" font-size="11" fill="#334155">Embedded to vector</text>
      
      <!-- Step 3 -->
      <circle cx="390" cy="15" r="15" fill="#a855f7"/>
      <text x="390" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">3</text>
      <text x="415" y="20" font-size="11" fill="#334155">ChromaDB search</text>
      
      <!-- Step 4 -->
      <circle cx="570" cy="15" r="15" fill="#f59e0b"/>
      <text x="570" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">4</text>
      <text x="595" y="20" font-size="11" fill="#334155">Top 3 chunks found</text>
      
      <!-- Step 5 -->
      <circle cx="760" cy="15" r="15" fill="#ec4899"/>
      <text x="760" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">5</text>
      <text x="785" y="20" font-size="11" fill="#334155">Ollama generates</text>
      
      <!-- Step 6 -->
      <circle cx="950" cy="15" r="15" fill="#f97316"/>
      <text x="950" y="20" font-size="12" font-weight="bold" text-anchor="middle" fill="white">6</text>
      <text x="975" y="20" font-size="11" fill="#334155">Display to user</text>
    </g>
    
    <!-- Timeline -->
    <line x1="110" y1="1500" x2="1000" y2="1500" stroke="#cbd5e1" stroke-width="2"/>
    <text x="80" y="1525" font-size="11" fill="#64748b">0ms</text>
    <text x="580" y="1525" font-size="11" fill="#64748b">~100ms</text>
    <text x="1030" y="1525" font-size="11" fill="#64748b">~3-5s</text>
    
    <!-- Performance notes -->
    <text x="80" y="1555" font-size="10" fill="#475569">⚡ Vector search: &lt;100ms  |  🤖 LLM generation: 2-5s  |  📊 Total: ~3-6s</text>
  </g>
  
  <!-- Arrow markers -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1e293b" />
    </marker>
    <marker id="arrowhead-large" markerWidth="12" markerHeight="12" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#1e293b" />
    </marker>
  </defs>
</svg>